<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Food Bot Workflow</title>
  <style>
    body {
      width: 280px;
      min-height: 120px;
      margin: 0;
      padding: 14px 16px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      color: #1e293b;
      background: #f8fafc;
    }
    h1 {
      margin: 0 0 10px;

      color: #0f172a;

      background: #e2e8f0;
